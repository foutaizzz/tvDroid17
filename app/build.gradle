plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        // targetSdk only changes behaviour on newer devices; on this Android 10 TV it is inert,
        // but keeping it current protects the launcher if it is ever installed on a newer TV.
        targetSdk 34
        versionCode 3
        versionName '1.0.0'
        // The TMDB read token is not compiled in: it is read from the television at runtime
        // (see TokenStore), so an APK that leaves the device carries no account key.
        testInstrumentationRunner project.findProperty('testRunner') ?: 'com.gathin.tvhome.ArtworkInstrumentation'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
}
